name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project pages are served from /<repo>/. When a custom domain is used (site served at the
  # root), set this to "/" instead.
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare Pages artifact
        run: |
          # With a non-root BASE_PATH, React Router nests the prerendered HTML under build/client/<base>/
          # while assets stay at build/client/. Pages serves the artifact root at <base>, so flatten it.
          dir="${BASE_PATH#/}"; dir="${dir%/}"
          if [ -n "$dir" ] && [ -d "build/client/$dir" ]; then
            cp -R "build/client/$dir/." build/client/
            rm -rf "build/client/$dir"
          fi
          # SPA fallback for unknown URLs.
          cp build/client/__spa-fallback.html build/client/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
